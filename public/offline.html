<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Trip is offline</title>
<style>
  :root { --ground: #E7E8E4; --ink: #1A201E; --ink-2: #4C5551; --accent: #1F6F5C; --line: #CDD0C8; }
  @media (prefers-color-scheme: dark) { :root { --ground: #121614; --ink: #E7EAE5; --ink-2: #A9B2AC; --accent: #4FC3A1; --line: #333C37; } }
  html { background: var(--ground); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; padding: env(safe-area-inset-top) max(20px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(20px, env(safe-area-inset-left)); max-width: 30rem; margin-inline: auto; }
  p.kicker { font: 600 11px/1 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 10px; }
  h1 { font: 800 clamp(30px, 8vw, 44px)/.98 system-ui, sans-serif; letter-spacing: -.018em; text-transform: uppercase; margin: 0 0 14px; }
  p { font-size: 16px; line-height: 1.5; margin: 0 0 18px; }
  button { font: 700 11px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; min-height: 44px; padding: 0 18px; border: 1px solid var(--accent); border-radius: 3px; background: var(--accent); color: var(--ground); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="kicker">Road Trip</p>
  <h1>You are offline</h1>
  <p>The board is read from the server each time, so it cannot show your trip without a connection. Your picks and stars are saved there and will be waiting when you are back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
