name: Feature request
description: Propose a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and why?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What success looks like
      description: Observable behaviour that would show the problem is solved. These become acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
