name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck, lint, unit tests, and next build (TS-001, NEXT-003, WA-001)
      - run: npm run verify
      # per-route JavaScript budgets (WEB-003)
      - run: npx size-limit

  migrations:
    # Lint new migration SQL (PG-002). Breaking changes need expand and contract.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # File names come from the pull request, so they never enter a script: they go to a file,
      # NUL-separated, and reach squawk as arguments.
      - name: Find changed migrations
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          list="$RUNNER_TEMP/migrations"
          git diff -z --name-only --diff-filter=AM "$BASE_SHA...HEAD" -- '*.sql' | { grep -zE '(migrations|drizzle|prisma)/' || true; } > "$list"
          if [ -s "$list" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: squawk
        if: steps.changed.outputs.any == 'true'
        run: xargs -0 npx --yes squawk-cli@2.66.0 < "$RUNNER_TEMP/migrations"

  status:
    # One comment on the pull request when CI finishes, naming the head commit, so whoever
    # waits on CI is notified instead of polling. Confirm checks on the current head before merging.
    needs: [verify, migrations]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    uses: lifelike-and-believable/rules-for-robots/.github/workflows/rfr-ci-status.yml@main
    with:
      results: ${{ toJSON(needs) }}
